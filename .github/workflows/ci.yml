name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:workflows
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Verify system tray lifecycle
        run: npm run smoke
        env:
          LIT_SMOKE_CASE: tray
      - name: Verify main editor quit protection
        run: npm run smoke
        env:
          LIT_SMOKE_CASE: feature-main-quit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-diagnostics
          path: ${{ runner.temp }}/lit-guided-smoke
          if-no-files-found: ignore
